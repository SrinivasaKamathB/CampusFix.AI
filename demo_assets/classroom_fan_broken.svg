        <text x="25" y="388" fill="#F8FAFC" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Block B / Room 204  -  Ceiling Fan</text>
        <text x="400" y="388" fill="#F87171" font-family="Arial, sans-serif" font-size="11">DEFECT: Bent Blade / Motor Fault</text>
